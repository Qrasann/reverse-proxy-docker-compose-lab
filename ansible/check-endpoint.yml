---
- name: playbook
  hosts: devops_servers
  become: false

  vars:
    endpoints:
      - name: api
        url: http://localhost/api/
        expected: Hello from ENV
      - name: health
        url: http://localhost/health
        expected: OK
      - name: site1
        url: http://localhost/site1/
        expected: SITE 1
      - name: site2
        url: http://localhost/site2/
        expected: SITE 2

  tasks:
    - name: Check all endpoints
      ansible.builtin.uri:
        url: "{{ item.url }}"
        status_code: 200
        return_content: true
      loop: "{{ endpoints }}"
      loop_control:
        label: "{{ item.name }}"
      register: endpoint_result
      retries: 5
      delay: 2
      until: endpoint_result.status == 200
    - name: Validate endpoint responses
      ansible.builtin.assert:
        that:
          - item.status == 200
          - item.item.expected in item.content
      loop: "{{ endpoint_result.results }}"
      loop_control:
        label: "{{ item.item.name }}"
