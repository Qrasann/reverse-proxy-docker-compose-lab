---
- name: playbook
  hosts: devops_servers
  become: false
  
  vars:
    endpoints:
      - http://localhost/api/
      - http://localhost/health
      - http://localhost/site1/
      - http://localhost/site2/

  tasks:
    - name: Check all endpoints
      ansible.builtin.uri:
        url: "{{ item }}"
        status_code: 200
      loop: "{{ endpoints }}"
      register: endpoint_result
      retries: 5
      delay: 2
      until: endpoint_result.status == 200
