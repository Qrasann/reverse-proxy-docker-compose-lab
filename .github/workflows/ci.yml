name: Docker Compose CI

on:
  push:
    branches:
      - main
      - modernize/2026-foundation
  pull_request:

jobs:
  docker-compose-check:
    runs-on: ubuntu-latest

    env:
      MESSAGE: Hello from ENV

    steps:
      - uses: actions/checkout@v4

      - name: Check Python response encoding
        run: python -m unittest discover -s tests -v

      - name: Check script syntax
        run: bash -n scripts/smoke-test.sh

      - name: Install ansible-core
        run: python -m pip install ansible-core

      - name: Check Ansible syntax
        run: ansible-playbook -i ansible/hosts ansible/site.yml --syntax-check

      - name: Check Docker Compose config
        run: docker compose config

      - name: Build services
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Run smoke tests
        run: ./scripts/smoke-test.sh

      - name: Show containers
        if: always()
        run: docker compose ps

      - name: Stop services
        if: always()
        run: docker compose down
